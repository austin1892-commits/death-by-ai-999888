<style>
  :root{color-scheme:dark;--bg:#101018;--panel:#191925;--panel2:#222233;--line:#343449;--ink:#f6f4ff;--muted:#aaa8bd;--red:#ff5364;--gold:#ffc857;--green:#69dfad;--blue:#83b7ff}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{padding:14px}.wrap{width:min(100%,920px);margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ff5364,#9f1d45);font-size:22px;box-shadow:0 8px 28px #ff536433}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.19em;font-weight:800}.brand b{display:block;font-size:17px;letter-spacing:.05em}.status{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 10px;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px}.dot.ok{background:var(--green)}
  .hero{border:1px solid #51303e;background:radial-gradient(ellipse at 85% 0%,#64243955,transparent 40%),linear-gradient(140deg,#241923,#171721 62%);border-radius:22px;padding:clamp(20px,5vw,38px);overflow:hidden;position:relative}.eyebrow{color:var(--red);font-size:11px;font-weight:900;letter-spacing:.22em}.hero h1{font-size:clamp(34px,7vw,64px);line-height:.94;margin:12px 0 13px;letter-spacing:-.06em;max-width:680px}.hero h1 span{color:var(--red)}.hero p{color:#c5c1d2;line-height:1.55;max-width:590px;margin:0}.hero:after{content:'☠';position:absolute;right:3%;bottom:-40px;font-size:clamp(110px,22vw,210px);opacity:.07;pointer-events:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:19px}.panel h2,.panel h3{margin:0 0 8px}.panel h2{font-size:19px}.panel h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.5}.field{display:block;margin:13px 0}.field span{display:block;color:#c8c4d5;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:7px;text-transform:uppercase}.field input,.field textarea{width:100%;background:#101019;color:var(--ink);border:1px solid #3a394e;border-radius:11px;padding:12px 13px;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #ff53641b}.field textarea{min-height:105px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--red);color:#fff;font-size:13px;font-weight:900;cursor:pointer;transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn.secondary{background:#303044;color:#f2efff;border:1px solid #49485f}.btn.gold{background:var(--gold);color:#2a1c00}.btn.green{background:var(--green);color:#092719}.btn.full{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.error{color:#ff8792;background:#411e2a;border:1px solid #703140;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12px}.notice{color:#f5d48b;background:#3c301a;border:1px solid #6d5428;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12px;line-height:1.5}.hidden{display:none!important}
  .roomhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.code{font-size:27px;letter-spacing:.2em;font-weight:1000;color:var(--gold)}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:12px}.player{background:#11111b;border:1px solid #353448;border-radius:12px;padding:11px;min-width:0}.player strong{display:block;overflow-wrap:anywhere}.player small{color:var(--muted)}.player.out{opacity:.42;text-decoration:line-through}.player.you{border-color:#a74c61;box-shadow:inset 0 0 0 1px #a74c61}.scenario{border:1px solid #70404b;background:linear-gradient(140deg,#3a202c,#211b2a);border-radius:18px;padding:20px;margin:12px 0}.scenario .icon{font-size:28px}.scenario h2{font-size:clamp(22px,4vw,32px);margin:8px 0}.timer{font-size:36px;font-weight:1000;color:var(--gold);font-variant-numeric:tabular-nums}.bar{height:8px;background:#333244;border-radius:9px;overflow:hidden;margin:8px 0}.bar>i{height:100%;display:block;background:linear-gradient(90deg,var(--red),var(--gold));width:100%;transition:width .3s}.answerstate{border:1px dashed #4c4a62;border-radius:12px;padding:12px;color:var(--muted);font-size:12px}.result{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#11111b;border:1px solid #36354a;border-radius:12px;padding:12px;margin:8px 0}.score{font-size:25px;font-weight:1000;color:var(--gold)}.survive{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.09em}.dead{color:#ff7785;font-size:10px;font-weight:900;letter-spacing:.09em}.footer{text-align:center;color:#7f7d91;font-size:10px;margin:18px 0 6px}.loading{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:650px){body{padding:10px}.grid{grid-template-columns:1fr}.top{margin-bottom:12px}.hero{border-radius:17px}.panel{padding:15px}.status{font-size:10px}.roomhead{flex-direction:column}.code{font-size:23px}}

<div class="wrap">
  <header class="top"><div class="brand"><div class="logo">☠</div><div><small>THE SURVIVAL PARTY GAME</small><b>DEATH BY AI</b></div></div><div class="status" id="connection"><i class="dot"></i>Not connected</div></header>
  <main id="app"><div class="loading">Loading Death by AI…</div><noscript><div class="notice">This game needs JavaScript enabled in your browser.</div></noscript></main>
  <div class="footer">DEATH BY AI: LAST ALIVE · Make questionable choices. Blame the judge.</div>

<!-- Firebase compat scripts are used here instead of ES-module imports for wider Google Sites embed compatibility. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Small compatibility wrappers so the game logic below can use a consistent API.
const initializeApp = (config) => firebase.initializeApp(config);
const getAuth = (app) => firebase.auth(app);
const signInAnonymously = (auth) => auth.signInAnonymously();
const getDatabase = (app) => firebase.database(app);
const ref = (db, path) => db.ref(path);
const set = (reference, value) => reference.set(value);
const update = (reference, value) => reference.update(value);
const onValue = (reference, callback, errorCallback) => {
  const listener = (snapshot) => callback(snapshot);
  reference.on('value', listener, errorCallback);
  return () => reference.off('value', listener);
};
const onDisconnect = (reference) => reference.onDisconnect();
const runTransaction = (reference, updater) => reference.transaction(updater, undefined, false);

const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_DATABASE_NAME.REGION.firebasedatabase.app",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID",
  // Optional: include messagingSenderId if it appears in your Firebase web config.
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID"
};

const appEl = document.getElementById('app');
const connectionEl = document.getElementById('connection');
const state = { db:null, auth:null, uid:null, name:'', code:'', room:null, roomUnsub:null, tick:null, draft:'', busy:false, error:'', notice:'', setupNeeded:false };
const scenarios = [
  {icon:'🧟',title:'ZOMBIE OUTBREAK',desc:'The city has fallen. The streets are full of zombies and your group has 60 seconds to choose a plan.'},
  {icon:'👽',title:'ALIEN LANDING',desc:'A spacecraft has landed outside town. Its occupants are scanning for life. What is your move?'},
  {icon:'🤖',title:'ROBOT UPRISING',desc:'The household robots have formed an army. The Wi-Fi is down. Your survival plan?'},
  {icon:'🌋',title:'VOLCANO TIME',desc:'The mountain is erupting and ash is covering the sky. You have one shot at getting to safety.'},
  {icon:'🏚️',title:'HAUNTED HOTEL',desc:'The elevator is moving by itself. Something is in the hallway. Check-out is not an option.'},
  {icon:'🥶',title:'FROZEN WASTELAND',desc:'The temperature is dropping fast. Your group has limited supplies and one chance to prepare.'},
  {icon:'☄️',title:'ASTEROID PANIC',desc:'An asteroid is heading your way. The emergency broadcast has cut off mid-sentence.'},
  {icon:'🦖',title:'DINOSAUR PARK',desc:'The electric fences have failed. The dinosaurs are loose and the tour bus is missing.'}
];

function configured(){return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('YOUR_') && FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith('YOUR_') && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('YOUR_') && FIREBASE_CONFIG.appId && !FIREBASE_CONFIG.appId.startsWith('YOUR_')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setConnection(text,ok=false){connectionEl.innerHTML=`<i class="dot ${ok?'ok':''}"></i>${esc(text)}`}
function showError(msg){state.error=msg;render()}
function clearMessages(){state.error='';state.notice=''}
function roomRef(){return ref(state.db,`rooms/${state.code}`)}
function myPlayer(){return state.room?.players?.[state.uid]||null}
function activePlayers(){return Object.entries(state.room?.players||{}).filter(([,p])=>p.alive!==false)}
function isHost(){return !!state.room && state.room.hostId===state.uid}
function randomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function nameValid(n){return n.length>=2&&n.length<=16}
function initFirebase(){if(!configured()){state.setupNeeded=true;setConnection('Setup needed');render();return false}state.setupNeeded=false;try{const app=initializeApp(FIREBASE_CONFIG);state.auth=getAuth(app);state.db=getDatabase(app);setConnection('Connecting…');return true}catch(e){showError('Firebase setup error: '+e.message);setConnection('Setup error');return false}}
async function signIn(){if(state.uid)return;const cred=await signInAnonymously(state.auth);state.uid=cred.user.uid}
function listenRoom(){if(state.roomUnsub)state.roomUnsub();state.roomUnsub=onValue(roomRef(),snap=>{state.room=snap.val();if(!state.room){state.code='';state.roomUnsub?.();state.roomUnsub=null;setConnection('Room closed');showError('This room no longer exists. Create a new room or join another one.');return}setConnection('Online',true);render();checkRoundProgress()},err=>{setConnection('Connection error');showError('Could not read the room: '+err.message)})}
async function attachPresence(){const pRef=ref(state.db,`rooms/${state.code}/presence/${state.uid}`);const connectedRef=ref(state.db,'.info/connected');onValue(connectedRef,async snap=>{if(snap.val()===true){try{await onDisconnect(pRef).set(false);await set(pRef,true)}catch(e){console.warn('Presence update failed',e)}}})}
async function createRoom(name){if(!nameValid(name))return showError('Your name must be 2–16 characters.');state.name=name;state.busy=true;render();try{await signIn();let code,created=false;for(let i=0;i<8&&!created;i++){code=randomCode();const r=ref(state.db,`rooms/${code}`);const tx=await runTransaction(r,current=>current===null?({hostId:state.uid,status:'lobby',round:0,maxRounds:8,players:{[state.uid]:{name,alive:true,totalScore:0,joinedAt:Date.now()}},presence:{[state.uid]:true},submissions:{},history:[],createdAt:Date.now()}):undefined);created=tx.committed}if(!created)throw new Error('Could not find a free room code. Try again.');state.code=code;clearMessages();listenRoom();attachPresence()}catch(e){showError(e.message||'Could not create room. Check your Firebase setup.')}finally{state.busy=false;render()}}
async function joinRoom(name,code){if(!nameValid(name))return showError('Your name must be 2–16 characters.');code=code.trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code))return showError('Enter a valid 6-character room code.');state.name=name;state.busy=true;render();try{await signIn();const r=ref(state.db,`rooms/${code}`);let reason='';const tx=await runTransaction(r,current=>{if(!current){reason='Room not found.';return}if(current.status!=='lobby'){reason='That game has already started.';return}const players=current.players||{};if(Object.keys(players).length>=8){reason='That room is full (8 players max).';return}if(Object.values(players).some(p=>(p.name||'').toLowerCase()===name.toLowerCase())){reason='That name is already being used in this room.';return}current.players=current.players||{};current.presence=current.presence||{};current.players[state.uid]={name,alive:true,totalScore:0,joinedAt:Date.now()};current.presence[state.uid]=true;return current});if(!tx.committed)throw new Error(reason||'Could not join that room.');state.code=code;clearMessages();listenRoom();attachPresence()}catch(e){showError(e.message||'Could not join room. Check the room code and connection.')}finally{state.busy=false;render()}}
async function hostUpdate(patch){if(!isHost())return showError('Only the room host can do that.');await update(roomRef(),patch)}
async function startNextRound(){if(!isHost())return;const room=state.room;if(!room)return;const n=(room.round||0)+1;if(n>room.maxRounds)return finishGame();const s=scenarios[Math.floor(Math.random()*scenarios.length)];await hostUpdate({status:'round',round:n,scenario:s,deadline:Date.now()+45000,submissions:{},roundResolved:false,winner:null})}
async function submitAnswer(text){text=text.trim();if(!text)return showError('Type your survival plan first.');if(text.length>180)return showError('Keep your plan to 180 characters or fewer.');if(!state.room||state.room.status!=='round')return;state.draft=text;try{await set(ref(state.db,`rooms/${state.code}/submissions/${state.uid}`),{text,submittedAt:Date.now()});state.notice='Plan submitted. You can change it until the timer ends.';state.error='';render();checkRoundProgress()}catch(e){showError('Could not submit: '+e.message)}}
function hashText(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function judge(text,scenario,uid,round){const t=(text||'').toLowerCase();let score=37;const good=['hide','quiet','shelter','barricade','escape','run','leave','evacuate','water','food','first aid','medical','radio','map','rope','team','plan','supplies','light','fire','boat','car','truck','roof','reinforce','lock','signal','communicate','repair','rescue','filter','mask','helmet','climb','tunnel','safe'];const bad=['scream','panic','wait','do nothing','give up','fight everyone','sleep','split up','ignore','no plan','surrender'];for(const w of good)if(t.includes(w))score+=6;for(const w of bad)if(t.includes(w))score-=10;if(t.length>45)score+=5;if(t.length<12)score-=8;const theme=scenario?.title||'';const themed=theme.includes('ZOMBIE')?['quiet','barricade','roof','hide','radio']:theme.includes('ALIEN')?['hide','signal','radio','shelter','communicate']:theme.includes('ROBOT')?['power','unplug','hack','disable','metal','network']:theme.includes('VOLCANO')?['evacuate','mask','ash','high ground','leave']:theme.includes('FROZEN')?['warm','fire','shelter','supplies','layers']:theme.includes('HOTEL')?['light','lock','hide','stairs','quiet']:theme.includes('ASTEROID')?['shelter','underground','evacuate','reinforce']:['hide','fence','vehicle','escape','rescue'];for(const w of themed)if(t.includes(w))score+=5;const jitter=(hashText(`${uid}|${round}|${text}`)%13)-6;score=Math.max(0,Math.min(100,score+jitter));let reason=score>=85?'The judge is annoyingly impressed. You might actually make it.':score>=65?'A surprisingly sensible plan. The judge gives a reluctant nod.':score>=50?'You survive, but the judge has several concerns.':score>=30?'Bold strategy. Terrible survival statistics.': 'The judge has filed this plan under “absolutely not”.';return {score,reason}}
async function resolveRound(){if(!isHost()||!state.room||state.room.status!=='round'||state.room.roundResolved)return;try{await runTransaction(roomRef(),current=>{if(!current||current.status!=='round'||current.roundResolved)return;const players=current.players||{},subs=current.submissions||{},alive=Object.entries(players).filter(([,p])=>p.alive!==false);const allSubmitted=alive.every(([id])=>!!subs[id]?.text);if(!allSubmitted&&Date.now()<(current.deadline||0))return;const scores={};for(const [id,p] of alive){const result=judge(subs[id]?.text||'',current.scenario,id,current.round);scores[id]={name:p.name,answer:subs[id]?.text||'(No plan submitted)',score:result.score,reason:result.reason,alive:result.score>=50}}let survivors=Object.entries(scores).filter(([,x])=>x.alive);if(!survivors.length){const top=Math.max(...Object.values(scores).map(x=>x.score));for(const x of Object.values(scores))x.alive=x.score===top;survivors=Object.entries(scores).filter(([,x])=>x.alive)}for(const [id,x] of Object.entries(scores)){players[id].alive=x.alive;players[id].totalScore=(players[id].totalScore||0)+x.score}const history=current.history||[];history.push({round:current.round,scenario:current.scenario,scores,at:Date.now()});const remaining=Object.entries(players).filter(([,p])=>p.alive!==false);let status='results',winner=null;if(remaining.length<=1||current.round>=current.maxRounds){status='finished';const ranked=remaining.length?remaining:Object.entries(players);ranked.sort((a,b)=>(b[1].totalScore||0)-(a[1].totalScore||0));winner=ranked[0]?.[0]||null}current.players=players;current.history=history;current.status=status;current.roundResolved=true;current.winner=winner;return current})}catch(e){console.error('Could not resolve round',e)}}
function checkRoundProgress(){if(!isHost()||!state.room||state.room.status!=='round')return;const alive=activePlayers();const subs=state.room.submissions||{};const all=alive.length>0&&alive.every(([id])=>!!subs[id]?.text);if(all||Date.now()>=(state.room.deadline||0))resolveRound()}
async function finishGame(){if(!isHost())return;const players=state.room.players||{};const ranked=Object.entries(players).sort((a,b)=>(b[1].totalScore||0)-(a[1].totalScore||0));await hostUpdate({status:'finished',winner:ranked[0]?.[0]||null})}
async function restartGame(){if(!isHost())return;if(!confirm('Restart this room? Everyone will return to the lobby and scores will reset.'))return;const players={};for(const [id,p] of Object.entries(state.room.players||{}))players[id]={...p,alive:true,totalScore:0};await hostUpdate({status:'lobby',round:0,deadline:null,scenario:null,submissions:{},history:[],roundResolved:false,winner:null,players})}
async function copyCode(){try{await navigator.clipboard.writeText(state.code);state.notice='Room code copied!';render()}catch{state.notice='Your room code is '+state.code+'. Copy it manually.';render()}}
function renderHome(){return `<section class="hero"><div class="eyebrow">ONE BAD PLAN. ONE LAST PLAYER.</div><h1>DEATH <span>BY AI</span></h1><p>Survive ridiculous disasters by writing your best escape plan. The built-in judge scores your ideas, roasts your mistakes, and decides who makes it to the next round.</p></section>
  <div class="grid"><section class="panel"><h2>🎮 Create a room</h2><p class="muted small">Host a game for your friends. Share the six-character room code.</p><form id="createForm"><label class="field"><span>Your name</span><input name="name" maxlength="16" minlength="2" placeholder="e.g. ToastMaster" required></label><button class="btn full" type="submit" ${state.busy?'disabled':''}>${state.busy?'CONNECTING…':'CREATE ROOM'}</button></form></section>
  <section class="panel"><h2>🚪 Join a room</h2><p class="muted small">Enter your name and the code your host shared.</p><form id="joinForm"><label class="field"><span>Your name</span><input name="name" maxlength="16" minlength="2" placeholder="e.g. Captain Noodles" required></label><label class="field"><span>Room code</span><input name="code" maxlength="6" minlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.18em" required></label><button class="btn secondary full" type="submit" ${state.busy?'disabled':''}>${state.busy?'CONNECTING…':'JOIN GAME'}</button></form></section></div>
  <section class="panel" style="margin-top:14px"><h3>HOW TO PLAY</h3><div class="grid"><div class="small muted">① <b style="color:var(--ink)">Get a disaster.</b><br>Every round throws your group into a new ridiculous crisis.</div><div class="small muted">② <b style="color:var(--ink)">Write your plan.</b><br>You get 45 seconds to explain how you survive in 180 characters or less.</div><div class="small muted">③ <b style="color:var(--ink)">Face the judge.</b><br>A built-in game judge gives everyone a score and a verdict.</div><div class="small muted">④ <b style="color:var(--ink)">Stay alive.</b><br>Score 50+ to survive. Last player standing wins.</div></div></section>`}
function renderLobby(){const room=state.room,players=Object.entries(room.players||{}),online=room.presence||{};return `<section class="panel"><div class="roomhead"><div><div class="tag">WAITING ROOM · ${players.length}/8 PLAYERS</div><h2 style="margin-top:10px">Your survival squad</h2><p class="small muted">At least 2 players are needed to start.</p></div><div><div class="small muted">ROOM CODE</div><div class="code">${esc(state.code)}</div><button class="btn secondary" data-action="copy" style="margin-top:7px">COPY CODE</button></div></div><div class="players">${players.map(([id,p])=>`<div class="player ${id===state.uid?'you':''}"><strong>${esc(p.name)} ${id===state.uid?'(YOU)':''}</strong><small>${id===room.hostId?'👑 HOST · ':''}${online[id]?'🟢 ONLINE':'⚪ OFFLINE'}</small></div>`).join('')}</div><div class="notice" style="margin-top:14px">Share the room code with your friends. Your game starts when the host presses Start.</div><div class="row" style="margin-top:12px"><button class="btn full" data-action="start" ${!isHost()||players.length<2?'disabled':''}>START GAME</button><button class="btn secondary" data-action="leave">LEAVE ROOM</button></div>${!isHost()?'<p class="small muted">Waiting for the host to start…</p>':''}</section>`}
function renderRound(){const room=state.room,players=activePlayers(),subs=room.submissions||{},mySub=subs[state.uid],left=Math.max(0,Math.ceil(((room.deadline||Date.now())-Date.now())/1000)),pct=Math.max(0,Math.min(100,left/45*100));return `<section class="panel"><div class="roomhead"><div><div class="tag">ROUND ${room.round} OF ${room.maxRounds} · ${players.length} STILL ALIVE</div><h2 style="margin-top:8px">Survive this situation.</h2></div><div style="text-align:right"><div class="small muted">TIME LEFT</div><div class="timer">${left}s</div></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="scenario"><div class="icon">${esc(room.scenario?.icon||'☠️')}</div><h2>${esc(room.scenario?.title||'DISASTER')}</h2><p>${esc(room.scenario?.desc||'What is your survival plan?')}</p></div>${myPlayer()?.alive===false?'<div class="notice">You have been eliminated. Watch the rest of the round!</div>':mySub?`<div class="answerstate">✅ Your plan is submitted. You can change it before the timer ends.<br><b style="color:var(--ink)">${esc(mySub.text)}</b></div><form id="answerForm"><label class="field"><span>Edit your plan</span><textarea id="answer" name="answer" maxlength="180">${esc(state.draft||mySub.text)}</textarea></label><button class="btn full" type="submit">UPDATE MY PLAN</button></form>`:`<form id="answerForm"><label class="field"><span>Your survival plan · 180 characters max</span><textarea id="answer" name="answer" maxlength="180" placeholder="I would…" required>${esc(state.draft)}</textarea></label><div class="small muted" style="text-align:right;margin:-7px 0 10px"><span id="count">${state.draft.length}</span>/180</div><button class="btn full" type="submit" ${left<=0?'disabled':''}>SUBMIT SURVIVAL PLAN</button></form>`}<div class="answerstate" style="margin-top:12px">${players.filter(([id])=>subs[id]).length} / ${players.length} players have submitted. ${isHost()?'The round reveals when everyone submits or time runs out.':''}</div><div class="row" style="margin-top:12px"><button class="btn secondary" data-action="leave">LEAVE ROOM</button></div></section>`}
function renderResults(){const room=state.room,history=room.history||[],last=history[history.length-1],scores=last?.scores||{};const ranked=Object.entries(scores).sort((a,b)=>b[1].score-a[1].score);return `<section class="panel"><div class="tag">ROUND ${room.round} RESULTS</div><div class="scenario"><div class="icon">${esc(last?.scenario?.icon||'☠️')}</div><h2>${esc(last?.scenario?.title||'THE VERDICT')}</h2><p>The judge has reviewed everyone's survival plans.</p></div>${ranked.map(([id,x])=>`<div class="result"><div><b>${esc(x.name)} ${id===state.uid?'(YOU)':''}</b><div class="small muted" style="margin-top:5px">${esc(x.answer)}</div><div class="small muted" style="margin-top:4px">${esc(x.reason)}</div><div class="${x.alive?'survive':'dead'}" style="margin-top:7px">${x.alive?'✓ SURVIVED':'✕ ELIMINATED'}</div></div><div class="score">${x.score}</div></div>`).join('')}<div class="row" style="margin-top:15px">${room.status==='finished'?`<button class="btn gold full" data-action="restart" ${!isHost()?'disabled':''}>PLAY AGAIN</button>`:`<button class="btn full" data-action="continue" ${!isHost()?'disabled':''}>NEXT ROUND →</button>`}<button class="btn secondary" data-action="leave">LEAVE ROOM</button></div>${!isHost()&&room.status!=='finished'?'<p class="small muted">Waiting for the host to continue…</p>':''}</section>`}
function renderFinished(){const room=state.room,players=room.players||{},winner=players[room.winner],scores=Object.entries(players).sort((a,b)=>(b[1].totalScore||0)-(a[1].totalScore||0));return `<section class="hero" style="text-align:center"><div class="eyebrow">THE DISASTER HAS ENDED</div><div style="font-size:55px;margin:12px">🏆</div><h1 style="font-size:clamp(32px,7vw,54px)">${esc(winner?.name||'THE WINNER')}</h1><p style="margin:auto">${room.winner===state.uid?'You are the last one standing. Try not to let it go to your head.':'Somehow, they made it out alive.'}</p></section><section class="panel" style="margin-top:14px"><h2>FINAL LEADERBOARD</h2>${scores.map(([id,p],i)=>`<div class="result"><div><b>${i+1}. ${esc(p.name)} ${id===state.uid?'(YOU)':''}</b><div class="small muted">${p.alive===false?'Eliminated':'Survivor'}</div></div><div class="score">${p.totalScore||0}</div></div>`).join('')}<div class="row" style="margin-top:15px"><button class="btn gold full" data-action="restart" ${!isHost()?'disabled':''}>PLAY AGAIN</button><button class="btn secondary" data-action="leave">LEAVE ROOM</button></div>${!isHost()?'<p class="small muted">Only the host can restart this room.</p>':''}</section>`}
function setupPanel(){return `<div class="notice"><b>Online multiplayer setup needed</b><br>The game screen is running, but room codes need your own Firebase project. In Firebase, create a Realtime Database and enable Authentication → Sign-in method → Anonymous. Then replace the five placeholder values in <b>FIREBASE_CONFIG</b> below with your Firebase Web App settings. For a private friends-only test, start with these Realtime Database rules:<pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#ffe4a8">{
  "rules": {
    ".read": false,
    ".write": false,
    "rooms": {
      "$room": {
        ".read": "auth != null",
        ".write": "auth != null"
      }
    }
  }
}</pre>These allow signed-in (including anonymous) players to use rooms. Anyone with access to your Firebase project could still alter game data, so do not store private information here. After setup, publish the updated code again.</div>`}
function render(){if(state.busy&&!state.room){appEl.innerHTML='<div class="loading">Connecting to the survival network…</div>';return}let html;if(state.room){if(state.room.status==='lobby')html=renderLobby();else if(state.room.status==='round')html=renderRound();else if(state.room.status==='results')html=renderResults();else if(state.room.status==='finished')html=renderFinished();else html=renderLobby()}else html=(state.setupNeeded?setupPanel():'')+renderHome();appEl.innerHTML=(state.error?`<div class="error">${esc(state.error)}</div>`:'')+(state.notice?`<div class="notice">${esc(state.notice)}</div>`:'')+html;const answer=document.getElementById('answer');if(answer){answer.addEventListener('input',()=>{state.draft=answer.value;const count=document.getElementById('count');if(count)count.textContent=answer.value.length})}}

appEl.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='createForm'){const d=new FormData(form);await createRoom(String(d.get('name')||'').trim())}else if(form.id==='joinForm'){const d=new FormData(form);await joinRoom(String(d.get('name')||'').trim(),String(d.get('code')||''))}else if(form.id==='answerForm'){const d=new FormData(form);await submitAnswer(String(d.get('answer')||''))}});
appEl.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;try{if(action==='copy')await copyCode();if(action==='start'){if(state.room&&Object.keys(state.room.players||{}).length>=2)await startNextRound()}if(action==='continue')await startNextRound();if(action==='restart')await restartGame();if(action==='leave'){if(state.roomUnsub)state.roomUnsub();state.roomUnsub=null;state.room=null;state.code='';state.draft='';clearMessages();render()}}catch(err){showError(err.message||'Something went wrong.')}});
if(!initFirebase()){}else{signIn().then(()=>{setConnection('Ready to play',true);render()}).catch(e=>{setConnection('Sign-in failed');showError('Firebase anonymous sign-in failed. Enable Anonymous sign-in in Firebase Authentication. '+e.message)})}
state.tick=setInterval(()=>{if(state.room?.status==='round'){render();checkRoundProgress()}},1000);
render();
</script>

</body>
</html>
